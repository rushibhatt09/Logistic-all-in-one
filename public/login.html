<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In · Dermatouch Operations</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: #F5F0E8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Decorative background blobs */
    body::before {
      content: '';
      position: fixed;
      top: -120px; right: -120px;
      width: 480px; height: 480px;
      background: radial-gradient(circle, rgba(232,201,122,0.22) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -100px; left: -100px;
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(28,25,21,0.06) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .login-wrap {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .login-card {
      background: #FFFFFF;
      border-radius: 18px;
      padding: 40px 40px 36px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.04), 0 20px 60px rgba(0,0,0,0.10);
      border: 1px solid rgba(0,0,0,0.06);
    }

    /* Brand header */
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
    }
    .brand-logo {
      width: 44px; height: 44px;
      background: #1C1915;
      color: #E8C97A;
      border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 800; letter-spacing: -0.5px;
      flex-shrink: 0;
    }
    .brand-name {
      font-size: 17px; font-weight: 800;
      color: #1C1915;
      letter-spacing: 0.5px;
    }
    .brand-sub {
      font-size: 12px;
      color: #8B7D6B;
      font-weight: 500;
      margin-top: 1px;
    }

    /* Heading */
    .login-title {
      font-size: 22px; font-weight: 700;
      color: #1C1915;
      margin-bottom: 6px;
    }
    .login-subtitle {
      font-size: 14px;
      color: #8B7D6B;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* Form */
    .field {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 13px; font-weight: 600;
      color: #3D3630;
      margin-bottom: 7px;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #E0D8CE;
      border-radius: 9px;
      font-size: 14px;
      font-family: inherit;
      color: #1C1915;
      background: #FDFBF7;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #C4A35A;
      box-shadow: 0 0 0 3px rgba(196,163,90,0.15);
      background: #FFFFFF;
    }
    input::placeholder { color: #C4B8A8; }

    /* Password toggle */
    .pwd-wrap {
      position: relative;
    }
    .pwd-wrap input {
      padding-right: 42px;
    }
    .pwd-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: #8B7D6B; font-size: 15px; padding: 4px;
      display: flex; align-items: center;
    }
    .pwd-toggle:hover { color: #3D3630; }

    /* Error message */
    .err-msg {
      font-size: 13px;
      color: #C0392B;
      background: #FEF0EF;
      border: 1px solid #F5C6C2;
      border-radius: 8px;
      padding: 10px 13px;
      margin-bottom: 16px;
      display: none;
      line-height: 1.4;
    }
    .err-msg.show { display: block; }

    /* Submit */
    .btn-signin {
      width: 100%;
      padding: 13px;
      background: #1C1915;
      color: #E8C97A;
      border: none;
      border-radius: 10px;
      font-size: 15px; font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.2px;
      transition: background 0.15s, transform 0.1s;
      margin-top: 4px;
    }
    .btn-signin:hover:not(:disabled) { background: #2D2822; }
    .btn-signin:active:not(:disabled) { transform: scale(0.99); }
    .btn-signin:disabled {
      opacity: 0.6; cursor: not-allowed;
    }

    /* Spinner inside button */
    .btn-signin .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(232,201,122,0.3);
      border-top-color: #E8C97A;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer */
    .login-footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #F0EAE0;
      text-align: center;
      font-size: 12px;
      color: #B5A898;
    }
    .login-footer strong { color: #8B7D6B; }

    /* Who's signed in badge */
    .active-users {
      margin-top: 14px;
      font-size: 12px;
      color: #8B7D6B;
      text-align: center;
      display: none;
    }
    .active-users.show { display: block; }
    .active-dot {
      display: inline-block; width: 7px; height: 7px;
      background: #27AE60; border-radius: 50%;
      margin-right: 5px; vertical-align: middle;
    }
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">

    <div class="brand">
      <div class="brand-logo">D</div>
      <div>
        <div class="brand-name">DERMATOUCH</div>
        <div class="brand-sub">Operations Command Centre</div>
      </div>
    </div>

    <h1 class="login-title">Welcome back</h1>
    <p class="login-subtitle">Sign in to access your operations dashboard</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username"
               placeholder="Enter your username"
               autocomplete="username" spellcheck="false">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pwd-wrap">
          <input type="password" id="password" name="password"
                 placeholder="Enter your password"
                 autocomplete="current-password">
          <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="Show/hide password">
            👁
          </button>
        </div>
      </div>

      <div class="err-msg" id="errMsg"></div>

      <button type="submit" class="btn-signin" id="submitBtn">Sign In</button>
    </form>

    <div class="login-footer">
      <strong>Dermatouch</strong> &middot; Internal Operations Platform<br>
      Authorised personnel only
    </div>

  </div>

  <div class="active-users" id="activeUsers">
    <span class="active-dot"></span>
    <span id="activeText"></span>
  </div>
</div>

<script>
  // If already logged in, go straight to dashboard
  fetch('/api/auth/me').then(r => {
    if (r.ok) window.location.replace('/');
  }).catch(() => {});

  // Show how many people are currently active (optional — needs a quick ping)
  // Skipped to avoid auth chicken-and-egg issue on login page

  // Password visibility toggle
  const pwdInput  = document.getElementById('password');
  const pwdToggle = document.getElementById('pwdToggle');
  pwdToggle.addEventListener('click', () => {
    const show = pwdInput.type === 'password';
    pwdInput.type = show ? 'text' : 'password';
    pwdToggle.textContent = show ? '🙈' : '👁';
  });

  // Login form
  const form   = document.getElementById('loginForm');
  const errMsg = document.getElementById('errMsg');
  const btn    = document.getElementById('submitBtn');

  function showError(msg) {
    errMsg.textContent = msg;
    errMsg.classList.add('show');
  }
  function clearError() {
    errMsg.textContent = '';
    errMsg.classList.remove('show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username) { showError('Please enter your username.'); return; }
    if (!password) { showError('Please enter your password.'); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Signing in…';

    try {
      const res = await fetch('/api/auth/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ username, password })
      });

      if (res.ok) {
        btn.innerHTML = '✓ Success';
        setTimeout(() => { window.location.replace('/'); }, 300);
      } else {
        const data = await res.json().catch(() => ({}));
        showError(data.error || 'Invalid username or password. Please try again.');
        btn.disabled  = false;
        btn.innerHTML = 'Sign In';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    } catch {
      showError('Connection error. Make sure the server is running.');
      btn.disabled  = false;
      btn.innerHTML = 'Sign In';
    }
  });

  // Auto-focus username field
  document.getElementById('username').focus();
</script>
</body>
</html>
